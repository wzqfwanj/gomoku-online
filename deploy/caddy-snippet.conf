# ===== Gomoku 五子棋（dev 180.76.180.249:8086，公开子路径 /gomoku/） =====
#
# 插入位置（重要）：
#   打开 /etc/caddy/Caddyfile，找到 `wkeeli.cn { ... }` 块，本段必须插在
#   该块内、兜底语句 `reverse_proxy localhost:5000`（约第 132 行）之前，
#   建议紧跟 /airplane 块之后、`reverse_proxy localhost:5000` 之前。
#
# 访问地址：https://wkeeli.cn/gomoku/  （公开，无密码）
# 前端与后端同源，站级 CSP 的 `connect-src 'self'` 已允许同源 SSE / WebSocket。

redir /gomoku /gomoku/ 308
handle_path /gomoku/* {
	reverse_proxy http://180.76.180.249:8086 {
		# 后端若需感知挂载前缀（拼绝对 URL / 静态资源路径）时使用
		header_up X-Forwarded-Prefix /gomoku
		# SSE 关键：关闭响应缓冲，否则事件流会被攒批、客户端迟迟收不到
		flush_interval -1
	}
}
