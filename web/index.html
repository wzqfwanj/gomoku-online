<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; media-src 'self' blob: https://incompetech.com; base-uri 'none'; form-action 'self'">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<meta name="description" content="联机小游戏平台：五子棋、连连看、大富翁，创建房间邀请好友实时对战。">
<title>联机小游戏</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="llk.css">
<link rel="stylesheet" href="monopoly.css">
<script src="llk.js" defer></script>
<script src="monopoly.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div class="aurora" aria-hidden="true">
  <i class="aurora-blob aurora-blob--a"></i>
  <i class="aurora-blob aurora-blob--b"></i>
  <i class="aurora-blob aurora-blob--c"></i>
  <i class="aurora-blob aurora-blob--d"></i>
</div>

<div class="app">
  <button id="theme-toggle" class="theme-toggle" type="button" title="切换明暗主题" aria-label="切换明暗主题">
    <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="4.1" fill="currentColor"></circle>
      <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M12 2.6v2.1M12 19.3v2.1M2.6 12h2.1M19.3 12h2.1M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M18.7 5.3l-1.5 1.5M6.8 17.2l-1.5 1.5"></path>
      </g>
    </svg>
    <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8a7.5 7.5 0 1 0 10.8 10.8Z" fill="currentColor"></path>
    </svg>
    <span class="theme-toggle-text">主题</span>
  </button>

  <!-- ============================ 平台首页 ============================ -->
  <main id="view-home" class="view home">
    <div class="home-card panel">
      <header class="home-head">
        <p class="eyebrow">ONLINE GAMES · 双人联机</p>
        <h1 class="title title--home">联机小游戏</h1>
        <p class="subtitle">选一个游戏创建房间，或输入房号加入朋友的房间。</p>
      </header>

      <div class="game-picker">
        <article class="game-card">
          <span class="game-card-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" focusable="false">
              <g stroke="currentColor" stroke-width="1.4" opacity="0.35">
                <path d="M14 6v36M24 6v36M34 6v36M6 14h36M6 24h36M6 34h36"></path>
              </g>
              <circle cx="14" cy="14" r="5" fill="currentColor"></circle>
              <circle cx="24" cy="24" r="5" fill="none" stroke="currentColor" stroke-width="2"></circle>
              <circle cx="34" cy="34" r="5" fill="currentColor"></circle>
            </svg>
          </span>
          <h2 class="game-card-name">五子棋</h2>
          <p class="game-card-desc">黑先 · 五连获胜 · 支持悔棋与比分</p>
          <button id="create-gomoku" class="btn btn-primary" type="button">创建房间</button>
        </article>

        <article class="game-card">
          <span class="game-card-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" focusable="false">
              <rect x="6" y="6" width="13" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="2"></rect>
              <rect x="29" y="29" width="13" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="2"></rect>
              <rect x="29" y="6" width="13" height="13" rx="3" fill="currentColor" opacity="0.22"></rect>
              <rect x="6" y="29" width="13" height="13" rx="3" fill="currentColor" opacity="0.22"></rect>
              <path d="M19 12.5h7M35 19v7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.55"></path>
              <path d="M12.5 19v7M19 35.5h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.55"></path>
            </svg>
          </span>
          <h2 class="game-card-name">连连看</h2>
          <p class="game-card-desc">双人各一盘 · 先清空者胜</p>
          <button id="create-llk" class="btn" type="button">创建房间</button>
        </article>

        <article class="game-card">
          <span class="game-card-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" focusable="false">
              <path d="M8 12h32v24H8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" opacity="0.55"></path>
              <path d="M8 20h32M20 20v16M28 20v16" stroke="currentColor" stroke-width="1.5" opacity="0.4"></path>
              <rect x="10" y="14" width="8" height="4" rx="1" fill="currentColor" opacity="0.75"></rect>
              <rect x="22" y="28" width="8" height="4" rx="1" fill="currentColor" opacity="0.45"></rect>
              <circle cx="31" cy="9" r="4" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
              <circle cx="38" cy="15" r="4" fill="currentColor" opacity="0.35"></circle>
            </svg>
          </span>
          <h2 class="game-card-name">大富翁</h2>
          <p class="game-card-desc">双人 · 掷骰买地 · 收租盖房 · 破产判负</p>
          <button id="create-monopoly" class="btn" type="button">创建房间</button>
        </article>
      </div>

      <div class="divider"><span>或输入房号加入</span></div>

      <form id="join-form" class="join-form" novalidate>
        <label class="sr-only" for="join-code">输入 6 位房号</label>
        <input id="join-code" class="join-input" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="6" placeholder="输入 6 位房号">
        <button id="join-submit" class="btn" type="submit">加入房间</button>
      </form>

      <p class="hint">创建房间后，把邀请链接发给朋友即可开始对局。</p>
    </div>
  </main>

  <!-- ============================ 五子棋对局 ============================ -->
  <main id="view-game" class="view game" hidden>
    <header class="game-head panel">
      <div class="room-info">
        <span class="room-label">房间</span>
        <code id="room-code" class="room-code">------</code>
        <button id="copy-btn" class="btn btn-small" type="button">复制邀请链接</button>
        <span id="score" class="score" aria-live="off" hidden>黑 0 : 0 白</span>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">正在连接…</p>
      <p id="presence" class="presence" aria-live="off"></p>
    </header>

    <div id="undo-banner" class="undo-banner" hidden role="status" aria-live="polite">
      <span id="undo-text" class="undo-text">对手请求悔棋</span>
      <span class="undo-actions">
        <button id="undo-accept" class="btn btn-small" type="button">同意</button>
        <button id="undo-reject" class="btn btn-small btn-ghost" type="button">拒绝</button>
        <button id="undo-cancel" class="btn btn-small btn-ghost" type="button">取消</button>
      </span>
    </div>

    <div class="board-wrap">
      <div class="board-stage">
        <canvas id="board" class="board" width="600" height="600" aria-label="五子棋棋盘">你的浏览器不支持 Canvas，请更换浏览器。</canvas>
        <canvas id="board-fx" class="board-fx" width="600" height="600" aria-hidden="true"></canvas>
      </div>
    </div>

    <footer class="game-actions">
      <button id="undo-btn" class="btn" type="button" hidden>悔棋</button>
      <button id="restart-btn" class="btn" type="button" hidden>再来一局</button>
      <button id="leave-btn" class="btn btn-ghost" type="button">返回大厅</button>
    </footer>
  </main>

  <!-- ============================ 连连看对局 ============================ -->
  <main id="view-llk" class="view llk" hidden>
    <header class="game-head panel">
      <div class="room-info">
        <span class="room-label">房间</span>
        <code id="llk-room-code" class="room-code">------</code>
        <button id="llk-copy-btn" class="btn btn-small" type="button">复制邀请链接</button>
      </div>
      <p id="llk-presence" class="presence" aria-live="off"></p>
    </header>

    <div id="llk-root" class="llk-root"></div>

    <footer class="game-actions">
      <button id="llk-restart-btn" class="btn" type="button" hidden>再来一局</button>
      <button id="llk-leave-btn" class="btn btn-ghost" type="button">返回大厅</button>
    </footer>
  </main>

  <!-- ============================ 大富翁对局 ============================ -->
  <main id="view-monopoly" class="view monopoly" hidden>
    <header class="game-head panel">
      <div class="room-info">
        <span class="room-label">房间</span>
        <code id="mono-room-code" class="room-code">------</code>
        <button id="mono-copy-btn" class="btn btn-small" type="button">复制邀请链接</button>
      </div>
      <p id="mono-presence" class="presence" aria-live="off"></p>
    </header>

    <div id="monopoly-root" class="monopoly-root"></div>

    <footer class="game-actions">
      <button id="mono-restart-btn" class="btn" type="button" hidden>再来一局</button>
      <button id="mono-leave-btn" class="btn btn-ghost" type="button">返回大厅</button>
    </footer>
  </main>
</div>

<div id="music-bar" class="music-bar" role="group" aria-label="背景音乐播放器">
  <button id="music-play" class="music-btn music-btn--main" type="button" aria-label="播放背景音乐" title="播放背景音乐" disabled>
    <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M8.5 5.4v13.2L19 12z" fill="currentColor"></path>
    </svg>
    <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M7.4 5.5h3.4v13H7.4zM13.2 5.5h3.4v13h-3.4z" fill="currentColor"></path>
    </svg>
  </button>

  <div class="music-info">
    <span id="music-title" class="music-title">背景音乐</span>
    <span id="music-artist" class="music-artist">默认关闭</span>
  </div>

  <span id="music-eq" class="music-eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>

  <button id="music-next" class="music-btn" type="button" aria-label="下一首" title="下一首" disabled>
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M5.8 5.4v13.2L15 12z" fill="currentColor"></path>
      <path d="M16.6 5.5h2.2v13h-2.2z" fill="currentColor"></path>
    </svg>
  </button>

  <button id="music-mute" class="music-btn music-btn--vol" type="button" aria-label="静音" title="静音" disabled>
    <svg class="icon icon-vol-on" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M4 9.3h3.4L12.4 5v14l-5-4.3H4z" fill="currentColor"></path>
      <path d="M15.6 8.7a4.7 4.7 0 0 1 0 6.6M18.2 6.2a8.2 8.2 0 0 1 0 11.6" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"></path>
    </svg>
    <svg class="icon icon-vol-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M4 9.3h3.4L12.4 5v14l-5-4.3H4z" fill="currentColor"></path>
      <path d="M16 9.2l5 5.6M21 9.2l-5 5.6" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"></path>
    </svg>
  </button>

  <input id="music-volume" class="music-volume" type="range" min="0" max="100" step="1" value="50" aria-label="音量" disabled>

  <a id="music-credit" class="music-credit" href="https://incompetech.com/music/royalty-free/" target="_blank" rel="noopener noreferrer" title="音乐：Kevin MacLeod · CC BY 4.0" aria-label="音乐：Kevin MacLeod · CC BY 4.0">CC BY 4.0</a>
</div>

<audio id="music-audio" preload="none"></audio>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
